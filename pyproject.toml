[project]
name = "vercel-flask-starter"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "cloudinary>=1.44.1",
  "flask>=3.1,<4.0",
  "flask-cors>=6.0.1",
  "google-auth>=2.42.1",
  "google-genai>=0.2.0",
  "google-generativeai>=0.8.5",
  "gunicorn~=23.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
  "python-dotenv>=1.0.0",
]
